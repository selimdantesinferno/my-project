<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>카드뉴스 자동화 공장</title>
<style>
  :root { --bg:#0f1117; --card:#1a1d27; --line:#2a2e3a; --fg:#e8eaf0; --sub:#8b90a0; --accent:#409cff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:24px 32px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; color:var(--sub); font-size:13px; }
  .wrap { display:grid; grid-template-columns:380px 1fr; gap:0; min-height:calc(100vh - 73px); }
  .panel { padding:24px 32px; }
  .panel.left { border-right:1px solid var(--line); }
  label { display:block; font-size:13px; color:var(--sub); margin:16px 0 6px; }
  textarea, input, select { width:100%; background:var(--card); border:1px solid var(--line);
         color:var(--fg); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; }
  textarea { resize:vertical; }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; }
  button { background:var(--accent); color:#fff; border:none; border-radius:10px;
         padding:12px 16px; font-size:15px; font-weight:600; cursor:pointer; width:100%; margin-top:20px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.sec { background:var(--card); border:1px solid var(--line); }
  .slides { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .slides img { width:100%; border-radius:12px; border:1px solid var(--line); }
  .meta-box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:20px; }
  .tags { color:var(--accent); font-size:13px; }
  .upload-row { display:flex; gap:16px; align-items:center; margin-top:8px; }
  .upload-row label { margin:0; color:var(--fg); display:flex; align-items:center; gap:6px; }
  .status { font-size:13px; margin-top:12px; white-space:pre-wrap; }
  .status.err { color:#ff6b6b; }
  .status.ok { color:#51cf66; }
  .empty { color:var(--sub); text-align:center; margin-top:80px; }
  .hint { font-size:12px; color:var(--sub); margin-top:4px; }
</style>
</head>
<body>
<header>
  <h1>🏭 카드뉴스 자동화 공장</h1>
  <p>링크·본문 입력 → AI가 슬라이드 생성 → 인스타그램·스레드 캐러셀 자동 업로드</p>
</header>

<div class="wrap">
  <!-- 입력 패널 -->
  <div class="panel left">
    <label>링크 (선택)</label>
    <input id="url" placeholder="https://... 글감으로 쓸 페이지 주소" />

    <label>본문 / 글감</label>
    <textarea id="source" rows="7" placeholder="유튜브 스크립트, 뉴스 기사 등 글감을 붙여넣으세요. 링크만 넣어도 됩니다."></textarea>

    <div class="row">
      <div>
        <label>템플릿</label>
        <select id="template"></select>
      </div>
      <div>
        <label>색상 톤</label>
        <select id="tone"></select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>슬라이드 수</label>
        <input id="slide_count" type="number" value="7" min="2" max="12" />
      </div>
      <div>
        <label>AI 제공자</label>
        <select id="provider"></select>
      </div>
    </div>

    <label>계정명 (카드 하단 표기)</label>
    <input id="account" placeholder="@my_account" />

    <label>프롬프트 (비우면 기본 프롬프트 사용)</label>
    <textarea id="prompt" rows="3"></textarea>
    <div class="hint" id="prompt-hint"></div>

    <button id="gen-btn">✨ 글쓰기 시작 (카드뉴스 생성)</button>
    <div class="status" id="gen-status"></div>

    <hr style="border:none;border-top:1px solid var(--line);margin:28px 0" />
    <label style="margin-top:0">📊 엑셀/CSV 대량 업로드 (최대 다수)</label>
    <div class="hint">행마다 글감→생성→예약 잡 등록. 예약시각 비우면 즉시 발행.</div>
    <input id="bulk-file" type="file" accept=".csv,.xlsx" style="margin-top:8px" />
    <div class="row" style="margin-top:8px">
      <button id="bulk-btn" class="sec" style="margin-top:0">⬆️ 대량 등록</button>
      <button id="sample-btn" class="sec" style="margin-top:0">📥 샘플 양식</button>
    </div>
    <div class="status" id="bulk-status"></div>
  </div>

  <!-- 결과 패널 -->
  <div class="panel right">
    <div id="empty" class="empty">왼쪽에서 글감을 입력하고 생성하면<br />여기에 카드뉴스 미리보기가 나타납니다.</div>

    <div id="result" style="display:none">
      <div class="meta-box">
        <label style="margin-top:0">게시물 캡션</label>
        <textarea id="caption" rows="3"></textarea>
        <div class="tags" id="hashtags"></div>
      </div>

      <div class="slides" id="slides"></div>

      <div class="meta-box" style="margin-top:20px">
        <label style="margin-top:0">업로드</label>
        <div class="upload-row">
          <label><input type="checkbox" id="ig" checked /> 인스타그램</label>
          <label><input type="checkbox" id="th" checked /> 스레드</label>
        </div>
        <label>고정(첫) 댓글</label>
        <input id="first_comment" placeholder="예: 프로필 링크를 확인해 주세요" />
        <label>예약 발행 시각 (비우면 즉시 발행)</label>
        <input id="scheduled_at" type="datetime-local" />
        <div class="row">
          <button id="up-btn" style="margin-top:12px">🚀 즉시 발행</button>
          <button id="sched-btn" class="sec" style="margin-top:12px">⏰ 예약 등록</button>
        </div>
        <div class="status" id="up-status"></div>
      </div>

      <div class="meta-box">
        <label style="margin-top:0">📅 예약 목록 <span id="jobs-count" class="hint"></span>
          <button id="refresh-btn" class="sec" style="width:auto;padding:4px 10px;margin:0 0 0 8px;font-size:12px">새로고침</button>
        </label>
        <div id="jobs"></div>
      </div>
    </div>
  </div>
</div>

<script>
let current = null; // {images, caption, hashtags}

async function loadOptions() {
  const r = await fetch('/api/options'); const o = await r.json();
  const tpl = document.getElementById('template');
  o.templates.forEach(t => tpl.add(new Option(t.label, t.value)));
  tpl.value = 'toss';
  const tone = document.getElementById('tone');
  o.tones.forEach(t => tone.add(new Option(t, t)));
  const prov = document.getElementById('provider');
  o.providers.forEach(p => prov.add(new Option(p, p)));
  prov.value = o.default_provider;
  document.getElementById('prompt-hint').textContent = '기본: ' + o.default_prompt;
}

document.getElementById('gen-btn').onclick = async () => {
  const btn = document.getElementById('gen-btn');
  const st = document.getElementById('gen-status');
  st.className = 'status'; st.textContent = '⏳ AI가 카드뉴스를 만드는 중...';
  btn.disabled = true;
  try {
    const body = {
      source_text: document.getElementById('source').value,
      url: document.getElementById('url').value,
      slide_count: parseInt(document.getElementById('slide_count').value),
      template: document.getElementById('template').value,
      tone: document.getElementById('tone').value,
      account: document.getElementById('account').value,
      prompt: document.getElementById('prompt').value,
      provider: document.getElementById('provider').value,
    };
    const r = await fetch('/api/generate', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '생성 실패');
    current = { images:d.images, caption:d.caption, hashtags:d.hashtags };
    document.getElementById('empty').style.display = 'none';
    document.getElementById('result').style.display = 'block';
    document.getElementById('caption').value = d.caption;
    document.getElementById('hashtags').textContent = d.hashtags.join('  ');
    const wrap = document.getElementById('slides'); wrap.innerHTML = '';
    d.image_urls.forEach(u => { const i = new Image(); i.src = u; wrap.appendChild(i); });
    st.className = 'status ok'; st.textContent = '✅ ' + d.images.length + '장 생성 완료!';
  } catch (e) {
    st.className = 'status err'; st.textContent = '❌ ' + e.message;
  } finally { btn.disabled = false; }
};

function pickTargets() {
  const t = [];
  if (document.getElementById('ig').checked) t.push('instagram');
  if (document.getElementById('th').checked) t.push('threads');
  return t;
}

document.getElementById('up-btn').onclick = async () => {
  if (!current) return;
  const st = document.getElementById('up-status');
  st.className = 'status'; st.textContent = '⏳ 업로드 중...';
  try {
    const r = await fetch('/api/upload', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        targets: pickTargets(), images: current.images,
        caption: document.getElementById('caption').value,
        hashtags: current.hashtags,
        first_comment: document.getElementById('first_comment').value,
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '업로드 실패');
    st.className = 'status ok';
    st.textContent = '✅ 업로드 완료\n' + d.results.map(x => `${x.platform}: ${x.id}`).join('\n');
  } catch (e) {
    st.className = 'status err'; st.textContent = '❌ ' + e.message;
  }
};

document.getElementById('sched-btn').onclick = async () => {
  if (!current) return;
  const st = document.getElementById('up-status');
  const when = document.getElementById('scheduled_at').value.replace('T', ' ');
  st.className = 'status'; st.textContent = '⏳ 예약 등록 중...';
  try {
    const r = await fetch('/api/schedule', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        targets: pickTargets(), images: current.images,
        caption: document.getElementById('caption').value,
        hashtags: current.hashtags,
        first_comment: document.getElementById('first_comment').value,
        scheduled_at: when, label: document.getElementById('account').value,
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '예약 실패');
    st.className = 'status ok'; st.textContent = '✅ 예약 등록 완료 (' + d.job.id + ')';
    loadJobs();
  } catch (e) {
    st.className = 'status err'; st.textContent = '❌ ' + e.message;
  }
};

async function loadJobs() {
  const r = await fetch('/api/jobs'); const d = await r.json();
  const box = document.getElementById('jobs');
  document.getElementById('jobs-count').textContent = '(' + d.jobs.length + ')';
  if (!d.jobs.length) { box.innerHTML = '<div class="hint">예약된 발행이 없습니다.</div>'; return; }
  const emoji = {scheduled:'🕒', publishing:'⏳', done:'✅', failed:'❌', canceled:'🚫'};
  box.innerHTML = d.jobs.map(j => {
    const t = new Date(j.scheduled_at).toLocaleString('ko-KR');
    const cancel = j.status === 'scheduled'
      ? ` <a href="#" onclick="cancelJob('${j.id}');return false" style="color:#ff6b6b">취소</a>` : '';
    const err = j.error ? ` <span style="color:#ff6b6b">${j.error}</span>` : '';
    return `<div class="hint" style="margin:6px 0">${emoji[j.status]||''} ${t} · ${j.targets.join('+')} · ${j.label||''} <b>[${j.status}]</b>${cancel}${err}</div>`;
  }).join('');
}

async function cancelJob(id) {
  await fetch('/api/jobs/' + id + '/cancel', {method:'POST'});
  loadJobs();
}

document.getElementById('refresh-btn').onclick = loadJobs;
document.getElementById('sample-btn').onclick = () => { window.location = '/api/bulk/sample'; };

document.getElementById('bulk-btn').onclick = async () => {
  const f = document.getElementById('bulk-file').files[0];
  const st = document.getElementById('bulk-status');
  if (!f) { st.className = 'status err'; st.textContent = '❌ 파일을 선택하세요.'; return; }
  st.className = 'status'; st.textContent = '⏳ 대량 처리 중... (행마다 AI 생성/렌더)';
  try {
    const fd = new FormData(); fd.append('file', f);
    const r = await fetch('/api/bulk', {method:'POST', body:fd});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '실패');
    const fails = d.results.filter(x => !x.ok);
    st.className = fails.length ? 'status' : 'status ok';
    st.textContent = `✅ ${d.created}/${d.total}건 등록`
      + (fails.length ? '\n실패: ' + fails.map(x => `행${x.row}: ${x.error}`).join('; ') : '');
    loadJobs();
  } catch (e) {
    st.className = 'status err'; st.textContent = '❌ ' + e.message;
  }
};

loadOptions();
loadJobs();
</script>
</body>
</html>
